{{ with .Paginator }}{{ if gt .TotalPages 1 }}
<nav class="pg" aria-label="Paginação">
  {{ if .HasPrev }}<a href="{{ .Prev.URL }}" rel="prev">← Anteriores</a>{{ else }}<span class="pg-off">← Anteriores</span>{{ end }}
  <span class="pg-info">Página {{ .PageNumber }} de {{ .TotalPages }}</span>
  {{ if .HasNext }}<a href="{{ .Next.URL }}" rel="next">Mais ofertas →</a>{{ else }}<span class="pg-off">Mais ofertas →</span>{{ end }}
</nav>
{{ end }}{{ end }}
